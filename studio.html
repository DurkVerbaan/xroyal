<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kapper Dashboard Backoffice</title>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
        "sanity": "https://esm.sh/sanity@3.38.0",
        "sanity/structure": "https://esm.sh/sanity@3.38.0/structure"
      }
    }
  </script>

  <script type="module">
    import React from 'react'
    import { defineConfig, renderStudio } from 'sanity'
    import { structureTool } from 'sanity/structure'

    const config = defineConfig({
      title: 'Kapper Dashboard',
      projectId: 'JOUW_PROJECT_ID_HIER', // <--- VERVANG DIT DOOR JOUW PROJECT ID
      dataset: 'production',
      plugins: [structureTool()],
      basePath: window.location.pathname, 
      schema: {
        types: [
          {
            name: 'salonInfo',
            title: 'Salon Informatie',
            type: 'document',
            fields: [
              { name: 'maandag', title: 'Maandag', type: 'string' },
              { name: 'dinsdag', title: 'Dinsdag', type: 'string' },
              { name: 'woensdag', title: 'Woensdag', type: 'string' },
              { name: 'donderdag', title: 'Donderdag', type: 'string' },
              { name: 'vrijdag', title: 'Vrijdag', type: 'string' },
              { name: 'zaterdag', title: 'Zaterdag', type: 'string' },
              { name: 'zondag', title: 'Zondag', type: 'string' },
              {
                name: 'galerij',
                title: 'Foto Galerij',
                type: 'array',
                of: [{ type: 'image' }]
              }
            ]
          }
        ]
      }
    })

    window.addEventListener('DOMContentLoaded', () => {
      renderStudio(document.getElementById('sanity-studio'), config)
    })
  </script>
  <style>
    html, body, #sanity-studio { height: 100vh; margin: 0; padding: 0; background: #f4f4f5; }
  </style>
</head>
<body>
  <div id="sanity-studio"></div>
</body>
</html>
